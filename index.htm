<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>¿Dónde está Lupita?</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main>
        <h1>¿Dónde está Lupita?</h1>
        <p class="sub">Lupita cuida que el dinero de Medellín se use bien. Lee la pista y toca el lugar donde se
            esconde.</p>
        <div class="stars" id="stars" aria-label="Progreso"></div>
        <div class="clue" id="clue" aria-live="polite"></div>

        <div class="map">
            <svg viewBox="0 0 300 440" role="img" aria-label="Mapa de Medellín">
                <rect width="300" height="440" fill="var(--land)" />
                <path d="M0 0H32C20 80 40 150 28 230S38 380 26 440H0Z" fill="var(--hill)" />
                <path d="M300 0H270C282 90 262 160 276 240S262 380 274 440H300Z" fill="var(--hill)" />
                <path d="M150 0C140 60 165 110 148 170S125 250 140 310 150 390 145 440" fill="none"
                    stroke="var(--river)" stroke-width="16" stroke-linecap="round" />
                <path d="M158 0C150 60 176 110 160 170S138 250 152 310 162 390 157 440" fill="none"
                    stroke="var(--orange)" stroke-width="3" stroke-dasharray="7 5" />
                <path d="M84 105Q150 120 150 120M210 70Q235 110 262 135" fill="none" stroke="#7b6a3a" stroke-width="2"
                    stroke-dasharray="2 4" />
                <g fill="#c9a97b" opacity=".55">
                    <rect x="60" y="40" width="9" height="9" />
                    <rect x="95" y="70" width="8" height="8" />
                    <rect x="90" y="215" width="10" height="9" />
                    <rect x="200" y="50" width="9" height="9" />
                    <rect x="215" y="170" width="10" height="8" />
                    <rect x="60" y="250" width="9" height="9" />
                    <rect x="110" y="360" width="10" height="9" />
                    <rect x="215" y="300" width="9" height="9" />
                    <rect x="195" y="410" width="10" height="9" />
                    <rect x="75" y="395" width="9" height="8" />
                    <rect x="100" y="150" width="8" height="8" />
                    <rect x="225" y="255" width="9" height="8" />
                </g>
                <g font-size="8" font-weight="700" fill="#2f3a22" opacity=".6" text-anchor="middle">
                    <text x="82" y="205">Cerro El Volador</text><text x="82" y="380">Cerro Nutibara</text><text x="182"
                        y="425">Río Medellín</text><text x="232" y="408">Envigado</text>
                </g>

                <g id="spots"></g>
            </svg>
        </div>

        <div class="found" id="found">
            <svg viewBox="0 0 100 100" aria-hidden="true">
                <circle cx="50" cy="56" r="34" fill="#f3c9a0" />
                <circle cx="50" cy="20" r="11" fill="#3b2a20" />
                <path d="M16 46Q50 -6 84 46Q50 28 16 46Z" fill="#4f9a3a" />
                <path d="M14 44L4 36L6 52Z M86 44L96 36L94 52Z" fill="#4f9a3a" />
                <circle cx="50" cy="38" r="5" fill="#3d7f2c" />
                <circle cx="37" cy="58" r="4" fill="#2f2a22" />
                <circle cx="63" cy="58" r="4" fill="#2f2a22" />
                <path d="M38 72Q50 84 62 72" fill="none" stroke="#a5452f" stroke-width="4" stroke-linecap="round" />
                <circle cx="17" cy="66" r="5" fill="#f2b705" />
                <circle cx="83" cy="66" r="5" fill="#f2b705" />
            </svg>
            <p id="fmsg"></p>
            <button id="next">Siguiente pista</button>
        </div>
    </main>

    <script src="js/script.js"></script>
</body>

</html>
